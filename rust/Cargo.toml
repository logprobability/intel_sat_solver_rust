[package]
name = "intel_sat_solver"
version = "0.1.0"
edition = "2021"
# is_multiple_of
rust-version = "1.87"
license = "MIT"
description = "Rust fork of the Intel(R) SAT Solver (IntelSAT / Topor)"

[lib]
name = "intel_sat_solver"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "intel_sat_solver"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

# The C++ solver relies on wrap-around unsigned arithmetic in a number of places; mirror it in every profile
[profile.dev]
overflow-checks = false
opt-level = 1

[profile.test]
overflow-checks = false
opt-level = 1

[profile.release]
overflow-checks = false
opt-level = 3
lto = true
codegen-units = 1
debug-assertions = false
